name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # The chat page test needs a real browser widget; WebView2 comes with the Windows image.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Webview
        run: |
          npm --prefix webview ci
          npm --prefix webview run build
          npm --prefix webview run typecheck
      - name: Fake agent
        run: npm --prefix tests/fixtures/fake-agent ci
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/*/target/surefire-reports
      - name: Update site
        uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: releng/io.github.liaoalia.kiroacp.site/target/repository
